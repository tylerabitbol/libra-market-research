name: Libra
options:
  bundleIdPrefix: com.tylerabitbol
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signing stays on. An unsigned build carries no entitlements, and without
    # `application-identifier` every Keychain call fails with -34018 — reads
    # silently, writes loudly. Same trap as the Swift app.
    CODE_SIGN_STYLE: Automatic
    # Only arm64 simulators are declared as Kotlin targets; an x86_64 slice
    # makes the Compose resource sync fail with "Unknown iOS simulator arch".
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: YES
    DEVELOPMENT_TEAM: 3RSPVBC57V

targets:
  Libra:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerabitbol.libra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Libra
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - LibraKit
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode does not inherit the shell environment, so Gradle has to be
          # pointed at a JDK explicitly.
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null) || \
            JAVA_HOME=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
