name: Libra
options:
  bundleIdPrefix: com.tylerabitbol
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signing stays on. An unsigned build carries no entitlements, and without
    # `application-identifier` every Keychain call fails with -34018 — reads
    # silently, writes loudly. Same trap as the Swift app.
    CODE_SIGN_STYLE: Automatic
    # Only arm64 simulators are declared as Kotlin targets; an x86_64 slice
    # makes the Compose resource sync fail with "Unknown iOS simulator arch".
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: YES
    DEVELOPMENT_TEAM: 3RSPVBC57V

targets:
  Libra:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # A real Info.plist, written by XcodeGen, rather than the one Xcode
    # synthesises from `GENERATE_INFOPLIST_FILE`. Compose's `PlistSanityCheck`
    # aborts the process at launch — SIGABRT on a blank screen, nothing in the
    # device log, the crash report the only evidence — unless
    # `CADisableMinimumFrameDurationOnPhone` is set, and the synthesised plist
    # understands only a fixed set of `INFOPLIST_KEY_*` settings and silently
    # drops everything else. The key is a ProMotion one: without it a Compose
    # app is capped to 60Hz on a 120Hz phone.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Libra
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerabitbol.libra
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - LibraKit
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode does not inherit the shell environment, so Gradle has to be
          # pointed at a JDK explicitly.
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null) || \
            JAVA_HOME=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
