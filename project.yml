name: Libra
options:
  bundleIdPrefix: com.tylerabitbol
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Signing must stay enabled: an unsigned build carries no entitlements at
    # all, and without `application-identifier` every Keychain call fails with
    # errSecMissingEntitlement (-34018) — reads silently, writes loudly.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3RSPVBC57V

targets:
  Libra:
    type: application
    platform: iOS
    sources:
      - path: Libra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerabitbol.libra
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Libra
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  LibraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LibraTests
    dependencies:
      - target: Libra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerabitbol.libra.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Libra:
    build:
      targets:
        Libra: all
    test:
      targets:
        - LibraTests
      gatherCoverageData: true
    run:
      config: Debug
