# Versions verified against maven-metadata.xml on 2026-09-15;
# the Ktor, serialization, Room and KSP entries on 2026-09-16.
# Rule for later phases: query the artifact's maven-metadata.xml before adding
# a version here. Do not guess — the ecosystem moves faster than memory.
[versions]
kotlin = "2.4.20"
agp = "9.4.0"
compose = "1.12.0"
androidMinSdk = "26"
androidTargetSdk = "37"
androidCompileSdk = "37"
jvmToolchain = "21"

coroutines = "1.11.0"
datetime = "0.8.0"
kermit = "2.2.0"
activityCompose = "1.13.0"
ktor = "3.5.2"
serialization = "1.11.0"
room = "2.8.5"
sqlite = "2.7.1"
# KSP decoupled from the Kotlin version; this is its own release line.
ksp = "2.3.12"
# Phase 8 additions, verified against maven-metadata.xml on 2026-09-16.
# Navigation's own latest is 2.10.0-beta01; this is the newest stable.
navigation = "2.9.2"
# Vico's multiplatform artifact, which publishes android, iosArm64 and
# iosSimulatorArm64. It asks for Compose 1.11.1 and resolves up to ours.
vico = "2.5.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# SEC serves gzip and asks for a User-Agent; ContentEncoding handles the former.
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# The bundled SQLite ships its own library, so iOS does not depend on whatever
# version the OS happens to carry.
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
vico-multiplatform = { module = "com.patrykandpatrick.vico:multiplatform", version.ref = "vico" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
