# Single source of truth for versions. Phase 0 applies only the plugins and
# libraries it needs; entries under "later phases" are declared so the numbers
# are agreed on now, but nothing depends on them yet.
[versions]
kotlin = "2.2.20"
agp = "8.13.0"
compose = "1.9.0"
androidMinSdk = "26"
androidTargetSdk = "36"
androidCompileSdk = "36"
jvmToolchain = "17"

coroutines = "1.10.2"
datetime = "0.7.1"
kermit = "2.0.8"
activityCompose = "1.10.1"

# --- later phases: declared, not yet applied ---
serialization = "1.9.0"
ktor = "3.3.0"
room = "2.8.0"
ksp = "2.2.20-2.0.2"
sqlite = "2.6.0"
lifecycle = "2.9.1"
navigation = "2.9.0-beta01"
vico = "2.2.0"
xmlutil = "0.91.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
